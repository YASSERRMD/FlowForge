version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: internal/db/dbgen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: pg_catalog.uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: citext
            go_type: string
